<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Recetas Deliciosas</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f8f8;
            color: #333;
        }
        .contact-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            text-align: center;
        }
        h1 {
            color: #ff7043;
        }
        .contact-info {
            margin-top: 20px;
            font-size: 1.2rem;
        }
        a {
            color: #ff7043;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        footer {
            margin-top: 40px;
            text-align: center;
            background-color: #ff7043;
            color: white;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div class="contact-container">
        <h1>Contacto</h1>
        <p>Si tienes alguna pregunta, no dudes en contactarnos:</p>
        <div class="contact-info">
            <p><strong>Teléfono:</strong> <a href="tel:+34123456789">+34 123 456 789</a></p>
            <p><strong>Email:</strong> <a href="mailto:contacto@recetasdeliciosas.com">contacto@recetasdeliciosas.com</a></p>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Recetas Deliciosas. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
